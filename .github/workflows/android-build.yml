# GitHub 의 Linux 서버에서 Android 앱을 빌드하고 테스트하는 설정.
# 성공하면 폰에 바로 설치할 수 있는 APK 파일이 만들어져요.
# → 저장소의 Actions 탭 → "Android Build" 실행 기록 → 맨 아래 Artifacts 에서 받을 수 있어요.

name: Android Build

on:
  push:
    paths:
      - 'android/**'
      - '!android/**.md'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - '!android/**.md'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 단위 테스트 (차단 시간·주소·연속 기록 계산)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: APK 만들기
        run: ./gradlew assembleDebug --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: NoDopamine-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 테스트 결과 올리기 (실패했을 때 확인용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/

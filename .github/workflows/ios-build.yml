# GitHub 의 Mac 서버에서 앱을 자동으로 빌드(컴파일)해 보는 설정.
# Mac 이 없어도, 코드를 올릴 때마다 "Xcode 에서 오류 없이 빌드되는지" 확인할 수 있어요.
# 결과는 GitHub 저장소의 Actions 탭에서 볼 수 있어요.
#
# 서명(signing)은 끄고 빌드하기 때문에 개발자 계정이 필요 없어요.
# 대신 이 결과물은 아이폰에 설치할 수는 없어요. (컴파일 확인용)

name: iOS Build

on:
  push:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android-build.yml'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      - name: 앱 빌드 (서명 없이)
        run: |
          xcodebuild build \
            -project NoDopamine.xcodeproj \
            -scheme NoDopamine \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
